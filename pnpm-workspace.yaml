packages:
  - apps/*
  - packages/*

catalog:
  "@typescript/native-preview": 7.0.0-dev.20260519.1
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - es5-ext
  - esbuild
  - futurescript
  - protobufjs
  - sharp
  - workerd

# Fresh publishes of our own package should not be blocked by release-age gates (CI/local).
minimumReleaseAgeExclude:
  - event-sourced-collection

dedupePeerDependents: true

overrides:
  vite: "catalog:"
  vitest: "catalog:"

# better-auth's optional peers stop at vitest 4 and better-sqlite3 12.
# Widen them so the catalog vitest and the app's sqlite 13 satisfy the same copy.
packageExtensions:
  better-auth:
    peerDependencies:
      better-sqlite3: "^12.0.0 || ^13.0.0"
      vitest: "^2.0.0 || ^3.0.0 || ^4.0.0 || ^5.0.0"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # Published ranges lag the versions this repo actually runs.
    better-sqlite3: "13"
    typescript: "6"
    ofetch: ">=2.0.0-0"
    "@vitest/ui": "5"
    "@tanstack/ai": "0.67"
