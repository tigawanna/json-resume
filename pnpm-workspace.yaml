packages:
  - apps/*
  - packages/*

catalog:
  "@typescript/native-preview": 7.0.0-dev.20260519.1
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  vitest: 5.0.1

onlyBuiltDependencies:
  - core-js
  - es5-ext
  - esbuild
  - futurescript
  - protobufjs
  - sharp
  - workerd

# Fresh publishes of our own package should not be blocked by release-age gates (CI/local).
minimumReleaseAgeExclude:
  - event-sourced-collection

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
