packages:
  - apps/*
  - packages/*
  # Solid 2 declares different package exports than the Solid 1 peers used by
  # apps/web; keep this app on its own lockfile so both can coexist.
  - "!apps/calc-paye-kenya"

catalog:
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - es5-ext
  - esbuild
  - futurescript
  - protobufjs
  - sharp
  - workerd
  - onnxruntime-node

# Fresh publishes of our own package should not be blocked by release-age gates (CI/local).
minimumReleaseAgeExclude:
  - event-sourced-collection

dedupePeerDependents: true

overrides:
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@babel/core": ^7.29.13
  "@protobufjs/utf8": ^1.1.2
  "@tanstack/db": 0.7.2
  "@tanstack/db-sqlite-persistence-core": 0.2.12
  adm-zip: ^0.6.1
  baseline-browser-mapping: ^2.11.35
  body-parser: ^2.4.0
  browserslist: ^4.29.5
  defu: ^6.1.5
  esbuild: ^0.28.2
  fast-uri: ^3.1.2
  ip-address: ^10.1.1
  js-yaml: ^4.3.2
  launch-editor: ^2.14.2
  lodash: ^4.18.0
  protobufjs: ^7.6.6
  proxy-addr: ^2.0.8
  qs: ^6.17.1
  seroval: ^1.7.10
  # apps/web and its devtools still target Solid 1; the Solid 2 port uses its own lockfile.
  solid-js: 1.9.19
  sharp: ^0.35.5
  shell-quote: ^1.12.0
  source-map-js: ^1.2.2
  ws: ^8.22.2
  picomatch: ^4.0.4
  postcss: ^8.5.10
  vite@*: "catalog:"

# better-auth's optional peers stop at vitest 4 and better-sqlite3 12.
# Widen them so the catalog vitest and the app's sqlite 13 satisfy the same copy.
packageExtensions:
  better-auth:
    peerDependencies:
      better-sqlite3: ^12.0.0 || ^13.0.0
      vitest: ^2.0.0 || ^3.0.0 || ^4.0.0 || ^5.0.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # Published ranges lag the versions this repo actually runs.
    better-sqlite3: "13"
    typescript: "6"
    ofetch: ">=2.0.0-0"
    "@vitest/ui": "5"
    "@tanstack/ai": "0.67"
ignoredBuiltDependencies:
  - "@journeyapps/wa-sqlite"
